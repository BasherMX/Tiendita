version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: tiendita-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-tiendita}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: tiendita-backend
    env_file:
      - .env
    environment:
      - PORT=4000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-tiendita}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS}
      - ENABLE_DEMO_SEED=false
    ports:
      - "0.0.0.0:4000:4000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: tiendita-frontend
    ports:
      - "0.0.0.0:1416:1416"
    depends_on:
      - backend
    restart: unless-stopped

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa
    ports:
      - "0.0.0.0:2785:2785"
    environment:
      - API_MASTER_KEY=tiendita_master_key_2026
      - WEBHOOK_SSRF_PROTECT=false
    volumes:
      - openwa-data:/app/data
    restart: unless-stopped

volumes:
  db-data:
  openwa-data:
